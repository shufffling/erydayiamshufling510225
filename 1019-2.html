<!DOCTYPE html>
<html>
<head>
<title>1019變形與轉變跟陰影</title>
<style>
div{
    width: 100px;
    height: 50px;
    border: 2px solid black;
    margin: 50px;
}
#d1:hover{
    transform: rotate(45deg);/*順時針旋轉*/
    background-color: white;
}
#d2:hover{
    transform: rotate(-45deg);/*逆時針旋轉*/
}
#d3:hover{
    transform: scale(0.5,1.2);/*倍率*/
}
#d4:hover{
    transform: translate(20px,10px);/*位移*/
}
#d5:hover{
    transform: skew(0,30deg);/*少見*/
}
#d6:hover{
    transform: translate(50px) rotate(45deg);/*先位移在旋轉*/
}
#d7:hover{
    transform:  rotate(45deg) translate(50px);/*先旋轉再位移*/
}
#d8:hover{
    background-color: blueviolet;
}
#d8{
    background-color: red;
    transition: background 1s;
}
#d7{
    transition: transform 1s;
}
#d6{
    transition: transform 1s;
}
#d5{
    transition: transform 1s;
}
#d4{
    transition: transform 1s;
}
#d3{
    transition: transform 1s;
}
#d2{
    transition: transform 1s;
}
#d1{
    transition: transform 1s;
    transition: background 1s;
    background-color: black;
}
#d9{
    box-shadow: 10px 10px green;/*前兩個參數 x/y 位移*/
}
#d10{
     box-shadow: 10px 10px 20px green;/*第三個參數 柔邊程度*/
}
#e1{
    box-shadow:0px 0px 5px green;/*第四個參數 擴大程度*/
}
#e2{
    font-size: 75px;
    text-shadow: 5px 5px 10px green;
}
#e3{
    font-size: 75px;
    color: white;
    text-shadow: 0px 0px 10px green;
}
</style>
</head>
<body>
<div id="d1"></div>
<div id="d2"></div>
<div id="d3"></div>
<div id="d4"></div>
<div id="d5"></div>
<div id="d6"></div>
<div id="d7"></div>
<div id="d8"></div>
<hr>
<div id="d9"></div>
<div id="d10"></div>
<div id="e1"></div>
<p id="e2">文字</p>
<p id="e3">文字</p>
</body>
</html>
